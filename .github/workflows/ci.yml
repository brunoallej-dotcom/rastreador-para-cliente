name: CI

# Quality and security gates (spec SEC-18, AC-30). No job uses secrets.
# Every action is pinned to a full commit SHA (trailing comment holds the tag); Dependabot bumps both.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On main every commit finishes its own CI run; on any other ref the superseded run is cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:hooks
      - run: pnpm contract:lint
      - run: pnpm build

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Reads pnpm-lock.yaml only; no install needed.
      - run: pnpm audit --prod --audit-level high

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal account: no GITLEAKS_LICENSE needed. No PR comments (avoids pull-requests: write);
          # findings go to the job summary and the SARIF artifact.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  # SAST (spec SEC-18): Semgrep CE from a container image pinned by digest (ADR 0012). scripts/sast.sh
  # runs it with Docker, so `pnpm sast` is this same scan. Nothing is uploaded: a finding fails the
  # job and appears only in the job log. The registry packs are fetched at run time. Dependabot does
  # not track this image: bump the digest by hand (the script reads it from SEMGREP_IMAGE below).
  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SEMGREP_IMAGE: semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 # 1.183.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the local rules against their fixtures
        run: sh scripts/sast.sh test
      - name: Scan
        run: sh scripts/sast.sh

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `supabase start` applies migrations and seed. Ports and keys come from supabase/config.toml;
      # the Vitest int and api projects read the URL and keys from `supabase status -o env`.
      - name: Start local Supabase
        run: >-
          pnpm exec supabase start
          -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit
      - run: pnpm db:test
      - run: pnpm db:lint
      - run: pnpm test:int
      - run: pnpm test:api
      # The file only exists from Wave 2 on. It is committed as generated (it is in .prettierignore).
      - name: Check generated DB types are up to date
        if: hashFiles('src/shared/db/database.types.ts') != ''
        run: |
          pnpm db:types
          git diff --exit-code -- src/shared/db/database.types.ts
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
