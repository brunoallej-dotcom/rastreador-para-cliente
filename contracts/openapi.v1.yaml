      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        clientId:
          $ref: '#/components/schemas/Uuid'
        client:
          $ref: '#/components/schemas/SessionClient'
        title:
          type: string
          maxLength: 160
        status:
          $ref: '#/components/schemas/ProcessStatus'
        currentStage:
          description: 'A fase `in_progress`: no processo ativo é a atual, no cancelado é onde ele parou (as fases ficam como estavam), e no concluído é `null`.'
          oneOf:
            - $ref: '#/components/schemas/AdminCurrentStage'
