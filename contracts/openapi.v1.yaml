    StageInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: 'Texto visível (veja "Texto visível" na descrição do contrato): NFC, pontas aparadas, sem caractere de controle ou de formatação, sem "filler" invisível e com ao menos uma letra ou um número; o comprimento conta caracteres depois disso. Violação → 400 `VALIDATION_ERROR`.'
        description:
          type: string
          maxLength: 2000
          description: 'Mesma regra de texto visível do `name`, com uma diferença: vazia ou só de espaços, depois de aparada, vale "sem descrição" (`description: null` na resposta), e não é erro.'
    CreateProcessRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          description: 'Texto visível (veja "Texto visível" na descrição do contrato): NFC, pontas aparadas, sem caractere de controle ou de formatação, sem "filler" invisível e com ao menos uma letra ou um número; o comprimento conta caracteres depois disso. Violação → 400 `VALIDATION_ERROR`. Único entre os processos ativos do cliente (409 `CONFLICT`).'
        stages:
          type: array
          description: Fases em ordem. Omitido → template padrão.
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/StageInput'
    UpdateProcessRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          description: 'Texto visível (veja "Texto visível" na descrição do contrato): NFC, pontas aparadas, sem caractere de controle ou de formatação, sem "filler" invisível e com ao menos uma letra ou um número; o comprimento conta caracteres depois disso. Violação → 400 `VALIDATION_ERROR`. Único entre os processos ativos do cliente (409 `CONFLICT`).'
        status:
          type: string
          description: Única transição manual permitida.
          enum: [cancelled]
    ApproveStageRequest:
      type: object
      additionalProperties: false
      required: [expectedStageId]
      properties:
        expectedStageId:
          description: 'A fase que o CEO viu como atual (controle de concorrência otimista, como um `If-Match`). Se não é a atual do processo (já concluída, ainda futura, de outro processo ou inexistente) → 409 `STALE_STAGE`, nunca 404.'
          allOf:
            - $ref: '#/components/schemas/Uuid'
    ActorRef:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        displayName:
          $ref: '#/components/schemas/DisplayName'
    StageApproval:
