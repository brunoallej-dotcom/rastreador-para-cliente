        gravada, nem quando só a releitura que devolve o corpo falhou): não duplica o processo
        enquanto o primeiro estiver ativo. Se a primeira chamada tinha sido gravada, a repetição
        responde 409 `CONFLICT` e o CEO lista os processos do cliente (`listClientProcesses`) para
        achar o que já existe; se não tinha, a repetição é a criação, 201. Se o primeiro processo já
        foi concluído ou cancelado nesse intervalo, o título voltou a ficar livre e a repetição cria
        outro. `Idempotency-Key` não existe.
