          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/StageStatus'
        startedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        approval:
          oneOf:
            - $ref: '#/components/schemas/StageApproval'
            - type: 'null'
    AdminCurrentStage:
      type: object
      additionalProperties: false
      required: [id, position, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        position:
          type: integer
          minimum: 1
          maximum: 30
        name:
          type: string
          maxLength: 120
    ProcessSummary:
      type: object
