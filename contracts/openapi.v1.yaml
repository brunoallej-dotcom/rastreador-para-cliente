      summary: Detalhar processo (visão de CEO)
      description: |
        Funciona para o processo de cliente arquivado (200). As fases vêm em ordem de `position` (1
        a n, sem buracos). Por status: a fase `pending` não tem `startedAt`, só a `completed` tem
        `completedAt` e `approval` (quem aprovou e quando); o processo `active` não tem `completedAt`
        nem `cancelledAt`, o `completed` tem `completedAt` e o `cancelled` tem `cancelledAt`.
        `currentStage` é a fase `in_progress`: no processo ativo é a atual, no cancelado é onde ele
        parou (as fases ficam como estavam), e no concluído é `null`. Processo que quebra as regras do
        modelo (sem fase, estado sem a data, duas aprovações numa fase) → 500 `INTERNAL_ERROR`, sem
        mostrar nada dele.
      tags: [Admin Processes]
      x-auth-policy:
        access: authenticated
        roles: [ceo]
        allowPending: []
      x-rate-limit:
        - scope: user
          limit: 300
          windowSeconds: 60
      parameters:
        - $ref: '#/components/parameters/ProcessId'
      responses:
        '200':
          description: Processo com fases e aprovações.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateProcess
      summary: Renomear ou cancelar processo
      description: |
        Renomeia (`title`) e/ou cancela (`status: cancelled`, a única transição manual; não há
        caminho de volta). Só processos `active` aceitam mudança; nos demais → 422
        `PROCESS_NOT_ACTIVE`, até para renomear para o mesmo título. O processo de um cliente
        **arquivado** não muda: → 422 `CLIENT_ARCHIVED` (o cliente precisa ser desarquivado antes,
        F-87), que vence `PROCESS_NOT_ACTIVE`. Precedência: 404, `CLIENT_ARCHIVED`,
        `PROCESS_NOT_ACTIVE` e, só no renome, 409 `CONFLICT`.

        Renomear para o título de outro processo **ativo** do mesmo cliente → 409 `CONFLICT`, sem
        dizer qual é o outro processo (a regra de `createProcess`); o processo fica como estava.
        Renomear para o próprio título, ou só trocar as maiúsculas e os espaços dele, é permitido.
        Renomear e cancelar na mesma chamada vale pelo estado final: o processo que acaba cancelado
        não disputa o título. Cancelar não muda as fases: a que estava em andamento continua.

        **Repetir depois de um 503** (que não diz se a primeira chamada foi gravada): o renome é
        idempotente (200, sem nova versão e sem novo evento). O cancelamento que já tinha sido
        gravado responde 422 `PROCESS_NOT_ACTIVE`, porque o processo já está cancelado: o 422 não
        desfaz nada, e o CEO confere `getProcess` antes de concluir que falhou.
      tags: [Admin Processes]
      x-auth-policy:
        access: authenticated
        roles: [ceo]
        allowPending: []
      x-rate-limit:
        - scope: user
          limit: 60
          windowSeconds: 60
      parameters:
        - $ref: '#/components/parameters/ProcessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProcessRequest'
      responses:
        '200':
          description: Processo atualizado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/processes/{processId}/approvals:
    post:
      operationId: approveCurrentStage
      summary: Dar "Ok" na fase atual
      description: |
        Conclui a fase atual e inicia a próxima (ou conclui o processo, se for a última). Basta
        **um** CEO. `expectedStageId` precisa ser a fase atual; se não for, responde 409
        `STALE_STAGE` com `currentStageId`: outro CEO já aprovou, houve um retry, a fase ainda é
        futura, já foi concluída ou é de **outro** processo. Nunca é 404 (um `expectedStageId`
        alheio é 409) e nunca pula uma fase. Operação atômica, com auditoria na mesma transação.

        Precedência dos erros: 404 se o processo não existe; 422 `CLIENT_ARCHIVED` se o
        cliente do processo está arquivado (F-87: o cliente precisa ser desarquivado antes);
        422 `PROCESS_NOT_ACTIVE` se o processo está concluído ou cancelado (que vence o 409: um
        `expectedStageId` velho num processo que já não está ativo é 422, e não 409); e só então o
        409 `STALE_STAGE`.

        **Repetir depois de um 503** (a resposta se perdeu, ou só a releitura que devolve o corpo
        falhou) nunca aprova duas vezes, porque a fase esperada é a chave: se a primeira chamada foi
        gravada, o retry com o mesmo `expectedStageId` responde 409 `STALE_STAGE` com a fase seguinte
        em `currentStageId`, ou 422 `PROCESS_NOT_ACTIVE` se era a última fase (ou se o processo foi
        cancelado depois); se não foi gravada, o retry é a própria aprovação, 200. O CEO que recebe o
        409 ou o 422 de um retry lê `getProcess` para ver o que a primeira chamada fez
        (`stages[].approval` diz quem concluiu cada fase).

        **O cliente da API nunca reenvia um "Ok" sozinho** (F-107): nem com o `currentStageId` de um
        409, nem depois de um 503, nem num retry automático da biblioteca de requisições. Reenviar
        com o `currentStageId` que acabou de receber aprova a fase **seguinte**, que o CEO nunca viu.
        Depois de um 409 ou de um 503, a tela mostra a fase atual (e quem aprovou a anterior), e o
        novo "Ok" é sempre um clique novo, sobre o que a tela mostra naquele momento.
      tags: [Admin Processes]
      x-auth-policy:
        access: authenticated
        roles: [ceo]
        allowPending: []
      x-rate-limit:
        - scope: user
          limit: 60
          windowSeconds: 60
      parameters:
        - $ref: '#/components/parameters/ProcessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveStageRequest'
            examples:
              approve:
                value:
                  expectedStageId: 7f1c2b4e-9a3d-4c5e-8f6a-1b2c3d4e5f60
      responses:
        '200':
          description: |
            Fase aprovada; devolve o processo **relido logo depois do COMMIT**: o corpo pode já incluir
            uma mudança concorrente gravada nesse intervalo (um cancelamento que esperava a trava, por
            exemplo), e nunca mostra um estado anterior a esta aprovação.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            A fase esperada não é mais a atual. `currentStageId` é a fase atual **no momento em que a
            resposta é montada** (o processo é relido depois do erro); é `null` só se o processo
            deixou de estar ativo entre o erro e a releitura (um cancelamento ou a última aprovação
            concorrentes).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StaleStageProblem'
              examples:
                otherCeoApproved:
                  summary: Outro CEO já aprovou a fase; a atual é a seguinte.
                  value:
                    type: about:blank
                    title: Stage is no longer current
                    status: 409
                    code: STALE_STAGE
                    detail: The stage is no longer the current one of the process.
                    requestId: 8f3b2c1d-0a4e-4b7a-9c55-2e1f6d7a8b90
                    currentStageId: 3d9c2f10-6b1e-4f7a-8a42-5c0e9b1d7e21
                processNoLongerActive:
                  summary: O processo foi cancelado entre o erro e a releitura.
                  value:
                    type: about:blank
                    title: Stage is no longer current
                    status: 409
                    code: STALE_STAGE
                    detail: The stage is no longer the current one of the process.
                    requestId: 1b7e4a90-3c2d-4e8f-a1b6-9d0c5f2e7a34
                    currentStageId: null
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/processes/{processId}/events:
    get:
      operationId: listProcessEvents
      summary: Linha do tempo do processo
      description: |
        Eventos de auditoria do processo em ordem **causal** crescente: pelo `id` do evento
        (sequencial), e não por `occurredAt`. Toda escrita do mesmo processo pega a trava dele antes
        de gravar a auditoria, então um evento posterior sempre tem `id` maior; já o `occurredAt` é o
        instante de início da transação, e uma escrita que esperou a trava pode mostrar um instante
        alguns milissegundos anterior ao do evento que a antecedeu. A ordem do `id` prevalece. O
        cursor é a posição do último `id` da página: os eventos novos entram no fim, e uma página
        posterior os traz. Só as ações de `ProcessEventAction` aparecem; uma ação nova só chega aqui
        depois de entrar nessa lista. Funciona para o processo de cliente arquivado (200).
      tags: [Admin Processes]
      x-auth-policy:
        access: authenticated
        roles: [ceo]
        allowPending: []
      x-rate-limit:
        - scope: user
          limit: 300
          windowSeconds: 60
      parameters:
        - $ref: '#/components/parameters/ProcessId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Eventos paginados.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessEventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/stage-templates/default:
    get:
      operationId: getDefaultStageTemplate
      summary: Template padrão de fases
      description: Alterado somente por migration.
      tags: [Admin Processes]
      x-auth-policy:
        access: authenticated
        roles: [ceo]
        allowPending: []
      x-rate-limit:
        - scope: user
          limit: 300
          windowSeconds: 60
      responses:
        '200':
          description: Fases padrão em ordem.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageTemplate'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rt-session
      description: |
        Cookie de sessão HttpOnly emitido por `POST /auth/login` (gerenciado por `@supabase/ssr`).
        Pode ser dividido em `__Host-rt-session.0`, `.1`… O access token interno expira em 15 min
        e é renovado de forma transparente; a sessão é checada no banco a cada requisição.

        Um cookie vencido (ou que o servidor não consegue verificar sem chamar o Auth) faz o servidor
        chamar o Auth, e cada IP tem um orçamento para isso (60 por 15 min, `x-rate-limit`
        programático, grupo `session-upstream`). Um IP sem orçamento recebe 401 `UNAUTHENTICATED` em
        qualquer operação autenticada, sem que o cookie seja apagado, até a janela passar.
      x-rate-limit:
        - scope: ip
          group: session-upstream
          limit: 60
          windowSeconds: 900
          programmatic: true

  parameters:
    ClientId:
      name: clientId
      in: path
      required: true
      description: Id do cliente.
      schema:
        $ref: '#/components/schemas/Uuid'
    ProcessId:
      name: processId
      in: path
      required: true
      description: Id do processo.
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: userId
      in: path
      required: true
      description: Id do login (usuário) do cliente.
      schema:
        $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      required: false
      description: Tamanho da página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: 'Cursor opaco devolvido em `nextCursor`; só serve ao endpoint que o emitiu. Valor adulterado, truncado, de outro endpoint ou com posição que o banco não lê → 400. Veja "Listas e cursor" na descrição do contrato.'
      schema:
        $ref: '#/components/schemas/Cursor'

  headers:
    X-Request-Id:
      description: Correlation id da requisição (também gravado nos logs e na auditoria).
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{8,64}$'
    Cache-Control:
      description: 'Sempre `no-store`: nenhuma resposta da API (nem a de erro) pode ser guardada por cache, compartilhado ou do navegador.'
      required: true
      schema:
        type: string
        enum: [no-store]
    Retry-After:
      description: Segundos até a próxima tentativa ser aceita.
      schema:
        type: integer
        minimum: 1
    Location:
      description: URL do recurso criado.
      schema:
        type: string
        format: uri-reference
    Set-Cookie-Session:
      description: '`__Host-rt-session=…; HttpOnly; Secure; SameSite=Lax; Path=/` (pode vir em chunks `.0`, `.1`).'
      schema:
        type: string
    Set-Cookie-Session-Refresh:
      description: |
        Só presente quando o token da sessão foi renovado durante a requisição: o cookie da própria
        sessão, `__Host-rt-session=…; HttpOnly; Secure; SameSite=Lax; Path=/` (pode vir em chunks).
      required: false
      schema:
        type: string

  responses:
    NoContentSessionRefresh:
      description: Sucesso sem corpo. Se o token da sessão foi renovado na requisição, o cookie vem reescrito.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Set-Cookie:
          $ref: '#/components/headers/Set-Cookie-Session-Refresh'
    NoContentClearCookie:
      description: Sessão encerrada; o cookie é expirado.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Set-Cookie:
          $ref: '#/components/headers/Set-Cookie-Session'
    BadRequest:
      description: Input inválido (`VALIDATION_ERROR`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    Unauthenticated:
      description: Sessão ausente, expirada ou revogada (`UNAUTHENTICATED`); no login, `INVALID_CREDENTIALS`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        `FORBIDDEN` (papel não permitido), `ORIGIN_NOT_ALLOWED` (CSRF) ou pendência:
        `PASSWORD_CHANGE_REQUIRED`, `MFA_ENROLLMENT_REQUIRED`, `MFA_VERIFICATION_REQUIRED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso inexistente ou de outro tenant (`NOT_FOUND`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        `EMAIL_ALREADY_REGISTERED`, `MFA_ALREADY_ENROLLED` ou `CONFLICT`. Em `createClient` e
        `updateClient`, `CONFLICT` é o nome de cliente que já é de outro cliente não arquivado. Em
        `createProcess` e `updateProcess`, `CONFLICT` é o título que já é de outro processo ativo do
        mesmo cliente.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Corpo maior que 16 KiB (`PAYLOAD_TOO_LARGE`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Corpo sem `Content-Type` application/json (`UNSUPPORTED_MEDIA_TYPE`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: |
        Regra de negócio violada: `PROCESS_NOT_ACTIVE`, `CLIENT_ARCHIVED`, `WEAK_PASSWORD`,
        `PASSWORD_UNCHANGED`, `INVALID_CURRENT_PASSWORD`, `INVALID_MFA_CODE`, `USER_LIMIT_REACHED`.
        `CLIENT_ARCHIVED` vale para provisionar login e criar processo de um cliente arquivado e, desde
        a `1.0.0-draft.4`, para aprovar a fase, renomear e cancelar um processo dele.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Limite excedido (`RATE_LIMITED`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Erro inesperado (`INTERNAL_ERROR`). Sem detalhes internos; use o `requestId`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: |
        Dependência indisponível ou lenta (`SERVICE_UNAVAILABLE`): limitador de taxa, banco ou Auth.
        A operação falha fechada, ou seja, nada é liberado por causa da falha. Escritas são atômicas
        (nada fica pela metade), mas um 503 não diz se a escrita chegou a ser gravada. Repetir uma
        escrita idempotente (`PATCH` de renome, desativar, arquivar) é seguro, e repetir `createClient`
        ou `createProcess` não duplica enquanto o primeiro cliente ou processo estiver ativo: se a
        primeira chamada tinha sido gravada, a repetição responde 409 `CONFLICT`. Nas demais escritas (`updateProcess` ao cancelar, `approveCurrentStage`,
        `provisionClientUser`, `resetClientUserPassword`), a descrição da própria operação diz o que
        a repetição devolve. A exceção, `changePassword`, está na descrição da operação.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Cursor:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[A-Za-z0-9_-]+$'
    Role:
      type: string
      enum: [client, ceo]
    Aal:
      type: string
      description: Nível de garantia da sessão (aal2 = MFA verificado).
      enum: [aal1, aal2]
    PendingAction:
      type: string
      enum: [CHANGE_PASSWORD, ENROLL_MFA, VERIFY_MFA]
    ProcessStatus:
      type: string
      enum: [active, completed, cancelled]
    StageStatus:
      type: string
      enum: [pending, in_progress, completed]
    Email:
      type: string
      format: email
      maxLength: 254
    DisplayName:
      type: string
      minLength: 1
      maxLength: 120
      description: 'Texto visível (veja "Texto visível" na descrição do contrato): NFC, pontas aparadas, sem caractere de controle ou de formatação, sem "filler" invisível e com ao menos uma letra ou um número; o comprimento conta caracteres depois disso. Violação → 400 `VALIDATION_ERROR`.'
    TemporaryPasswordValue:
      type: string
      minLength: 20
      maxLength: 20
      description: Senha temporária (CSPRNG). Exibida uma única vez; nunca logada.

    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - ORIGIN_NOT_ALLOWED
        - PASSWORD_CHANGE_REQUIRED
        - MFA_ENROLLMENT_REQUIRED
        - MFA_VERIFICATION_REQUIRED
        - NOT_FOUND
        - STALE_STAGE
        - EMAIL_ALREADY_REGISTERED
        - MFA_ALREADY_ENROLLED
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - PROCESS_NOT_ACTIVE
        - CLIENT_ARCHIVED
        - WEAK_PASSWORD
        - PASSWORD_UNCHANGED
        - INVALID_CURRENT_PASSWORD
        - INVALID_MFA_CODE
        - USER_LIMIT_REACHED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
          examples: ['about:blank']
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          maxLength: 500
          description: Mensagem para humanos, sem detalhes internos.
        requestId:
          type: string
          pattern: '^[A-Za-z0-9-]{8,64}$'
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required: [path, message]
                properties:
                  path:
                    type: string
                    description: Caminho do campo (ex. `body.stages[2].name`).
                  message:
                    type: string
    StaleStageProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [currentStageId]
          properties:
            currentStageId:
              description: 'Fase atual no momento em que a resposta é montada, relida depois do erro. `null` só se o processo deixou de estar ativo nesse intervalo (um cancelamento ou a última aprovação concorrentes).'
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 72
          description: No máximo 72 bytes UTF-8.
          writeOnly: true
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, role, displayName]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/Role'
        displayName:
          $ref: '#/components/schemas/DisplayName'
    SessionClient:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 160
    Session:
      type: object
      additionalProperties: false
      required: [user, client, aal, pendingActions]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        client:
          description: Cliente do usuário (null para CEO).
          oneOf:
            - $ref: '#/components/schemas/SessionClient'
            - type: 'null'
        aal:
          $ref: '#/components/schemas/Aal'
        pendingActions:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            $ref: '#/components/schemas/PendingAction'
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
          description: |
            No máximo 72 **bytes** UTF-8 (`maxLength` conta caracteres e só descarta o excesso
            óbvio: com letras de mais de um byte, 72 caracteres já passam de 72 bytes). Acima de 72
            bytes → 400 `VALIDATION_ERROR`. Se é a senha certa, só o servidor sabe: errada → 422
            `INVALID_CURRENT_PASSWORD`.
          writeOnly: true
        newPassword:
          type: string
          description: |
            Política: de 12 caracteres (pontos de código) a 72 bytes UTF-8, e diferente da atual.
            Sem `minLength`/`maxLength` de propósito: qualquer string que viole a política é 422
            `WEAK_PASSWORD` (E-12), nunca 400. O corpo inteiro é limitado a 16 KiB (413).
          writeOnly: true
    TotpEnrollment:
      type: object
      additionalProperties: false
      required: [factorId, uri, secret, qrCode]
      properties:
        factorId:
          $ref: '#/components/schemas/Uuid'
        uri:
          type: string
          pattern: '^otpauth://totp/'
          description: URI otpauth para apps autenticadores.
        secret:
          type: string
          description: Segredo base32 para digitação manual. Exibido uma única vez.
        qrCode:
          type: string
          pattern: '^data:image/svg\+xml'
          description: QR code em data URI SVG.
    TotpVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        factorId:
          $ref: '#/components/schemas/Uuid'
          deprecated: true
          description: |
            Obsoleto: omita. Sem ele o servidor usa o fator TOTP da sessão (ver `verifyTotp`). Se
            enviado, precisa ser fator TOTP do próprio usuário; fator alheio, inexistente ou removido
            → 422 `INVALID_MFA_CODE`, igual a um código errado. Nunca amplia o acesso: a identidade
            vem da sessão.
        code:
          type: string
          pattern: '^[0-9]{6}$'

    MyStage:
      type: object
      additionalProperties: false
      description: 'Fase na visão do cliente (sem dados internos de aprovação). `startedAt` é `null` enquanto a fase está `pending`; `completedAt` é `null` até ela ser `completed`.'
      required: [position, name, description, status, startedAt, completedAt]
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 30
        name:
          type: string
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/StageStatus'
        startedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    MyCurrentStage:
      type: object
      additionalProperties: false
      required: [position, name]
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 30
        name:
          type: string
          maxLength: 120
    MyProcessSummary:
      type: object
      additionalProperties: false
      required: [id, title, status, currentStage, totalStages, completedStages, progressPercent, createdAt, updatedAt, completedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
          maxLength: 160
        status:
          $ref: '#/components/schemas/ProcessStatus'
        currentStage:
          description: 'A fase `in_progress`: no processo ativo é a atual, no cancelado é onde ele parou, e no concluído é `null`.'
          oneOf:
            - $ref: '#/components/schemas/MyCurrentStage'
            - type: 'null'
        totalStages:
          type: integer
          minimum: 1
          maximum: 30
        completedStages:
          type: integer
          minimum: 0
          maximum: 30
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: '`round(100 × completedStages ÷ totalStages)`, com a metade arredondada para cima (1 de 3 é 33, 2 de 3 é 67, 1 de 8 é 13). Só chega a 100 quando todas as fases estão concluídas.'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    MyProcessDetail:
      type: object
      additionalProperties: false
      required: [id, title, status, currentStage, totalStages, completedStages, progressPercent, createdAt, updatedAt, completedAt, stages]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
          maxLength: 160
        status:
          $ref: '#/components/schemas/ProcessStatus'
        currentStage:
          description: 'A fase `in_progress`: no processo ativo é a atual, no cancelado é onde ele parou, e no concluído é `null`.'
          oneOf:
            - $ref: '#/components/schemas/MyCurrentStage'
            - type: 'null'
        totalStages:
          type: integer
          minimum: 1
          maximum: 30
        completedStages:
          type: integer
          minimum: 0
          maximum: 30
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: '`round(100 × completedStages ÷ totalStages)`, com a metade arredondada para cima (1 de 3 é 33, 2 de 3 é 67, 1 de 8 é 13). Só chega a 100 quando todas as fases estão concluídas.'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          description: 'Só o processo `completed` tem; nos demais é `null`.'
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        stages:
          type: array
          description: 'Em ordem de `position`, de 1 a n, sem buracos.'
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/MyStage'
    MyProcessList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MyProcessSummary'
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'

    ClientSummary:
      type: object
      additionalProperties: false
      required: [id, name, archived, archivedAt, activeProcessCount, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
