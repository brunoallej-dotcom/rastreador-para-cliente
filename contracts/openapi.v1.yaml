        processCount:
          type: integer
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    ClientList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ClientSummary'
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
    CreateClientRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          description: 'Texto visível (veja "Texto visível" na descrição do contrato): NFC, pontas aparadas, sem caractere de controle ou de formatação, sem "filler" invisível e com ao menos uma letra ou um número; o comprimento conta caracteres depois disso. Violação → 400 `VALIDATION_ERROR`.'
    UpdateClientRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          description: 'Texto visível (veja "Texto visível" na descrição do contrato): NFC, pontas aparadas, sem caractere de controle ou de formatação, sem "filler" invisível e com ao menos uma letra ou um número; o comprimento conta caracteres depois disso. Violação → 400 `VALIDATION_ERROR`.'
        archived:
          type: boolean
          description: '`true` arquiva (impede processos e logins novos e congela os processos que o cliente já tem: `CLIENT_ARCHIVED` ao aprovar, renomear e cancelar), `false` desarquiva (descongela). Repetir o mesmo valor não muda nada.'

    ClientUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, disabled, mustChangePassword, lastSignInAt, createdAt]
      properties:
