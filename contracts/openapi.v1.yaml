components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rt-session
      description: |
        Cookie de sessão HttpOnly emitido por `POST /auth/login` (gerenciado por `@supabase/ssr`).
        Pode ser dividido em `__Host-rt-session.0`, `.1`… O access token interno expira em 15 min
        e é renovado de forma transparente; a sessão é checada no banco a cada requisição.

        Um cookie vencido (ou que o servidor não consegue verificar sem chamar o Auth) faz o servidor
        chamar o Auth, e cada IP tem um orçamento para isso (60 por 15 min, `x-rate-limit`
        programático, grupo `session-upstream`). Um IP sem orçamento recebe 401 `UNAUTHENTICATED` em
        qualquer operação autenticada, sem que o cookie seja apagado, até a janela passar.
      x-rate-limit:
        - scope: ip
          group: session-upstream
          limit: 60
          windowSeconds: 900
          programmatic: true

  parameters:
    ClientId:
      name: clientId
      in: path
      required: true
      description: Id do cliente.
      schema:
        $ref: '#/components/schemas/Uuid'
    ProcessId:
      name: processId
      in: path
      required: true
      description: Id do processo.
      schema:
        $ref: '#/components/schemas/Uuid'
    UserId:
      name: userId
      in: path
      required: true
      description: Id do login (usuário) do cliente.
      schema:
        $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      required: false
      description: Tamanho da página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devolvido em `nextCursor`. Valor adulterado → 400.
      schema:
        $ref: '#/components/schemas/Cursor'

  headers:
    X-Request-Id:
      description: Correlation id da requisição (também gravado nos logs e na auditoria).
      schema:
        type: string
        pattern: '^[A-Za-z0-9-]{8,64}$'
    Retry-After:
      description: Segundos até a próxima tentativa ser aceita.
      schema:
        type: integer
        minimum: 1
    Location:
      description: URL do recurso criado.
      schema:
        type: string
        format: uri-reference
    Set-Cookie-Session:
      description: '`__Host-rt-session=…; HttpOnly; Secure; SameSite=Lax; Path=/` (pode vir em chunks `.0`, `.1`).'
      schema:
        type: string
    Set-Cookie-Session-Refresh:
      description: |
        Só presente quando o token da sessão foi renovado durante a requisição: o cookie da própria
        sessão, `__Host-rt-session=…; HttpOnly; Secure; SameSite=Lax; Path=/` (pode vir em chunks).
      required: false
      schema:
        type: string

  responses:
    NoContentSessionRefresh:
      description: Sucesso sem corpo. Se o token da sessão foi renovado na requisição, o cookie vem reescrito.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Set-Cookie:
          $ref: '#/components/headers/Set-Cookie-Session-Refresh'
    NoContentClearCookie:
      description: Sessão encerrada; o cookie é expirado.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Set-Cookie:
          $ref: '#/components/headers/Set-Cookie-Session'
    BadRequest:
      description: Input inválido (`VALIDATION_ERROR`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    Unauthenticated:
      description: Sessão ausente, expirada ou revogada (`UNAUTHENTICATED`); no login, `INVALID_CREDENTIALS`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: |
        `FORBIDDEN` (papel não permitido), `ORIGIN_NOT_ALLOWED` (CSRF) ou pendência:
        `PASSWORD_CHANGE_REQUIRED`, `MFA_ENROLLMENT_REQUIRED`, `MFA_VERIFICATION_REQUIRED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso inexistente ou de outro tenant (`NOT_FOUND`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: '`EMAIL_ALREADY_REGISTERED`, `MFA_ALREADY_ENROLLED` ou `CONFLICT`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Corpo maior que 16 KiB (`PAYLOAD_TOO_LARGE`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Corpo sem `Content-Type` application/json (`UNSUPPORTED_MEDIA_TYPE`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: |
        Regra de negócio violada: `PROCESS_NOT_ACTIVE`, `CLIENT_ARCHIVED`, `WEAK_PASSWORD`,
        `PASSWORD_UNCHANGED`, `INVALID_CURRENT_PASSWORD`, `INVALID_MFA_CODE`, `USER_LIMIT_REACHED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Limite excedido (`RATE_LIMITED`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Erro inesperado (`INTERNAL_ERROR`). Sem detalhes internos; use o `requestId`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: |
        Dependência indisponível ou lenta (`SERVICE_UNAVAILABLE`): limitador de taxa, banco ou Auth.
        A operação falha fechada, ou seja, nada é liberado por causa da falha. Escritas são atômicas,
        então repetir é seguro; a exceção, `changePassword`, está na descrição da operação.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Cursor:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[A-Za-z0-9_-]+$'
    Role:
      type: string
      enum: [client, ceo]
    Aal:
      type: string
      description: Nível de garantia da sessão (aal2 = MFA verificado).
      enum: [aal1, aal2]
    PendingAction:
      type: string
      enum: [CHANGE_PASSWORD, ENROLL_MFA, VERIFY_MFA]
    ProcessStatus:
      type: string
      enum: [active, completed, cancelled]
    StageStatus:
      type: string
      enum: [pending, in_progress, completed]
    Email:
      type: string
      format: email
      maxLength: 254
    DisplayName:
      type: string
      minLength: 1
      maxLength: 120
    TemporaryPasswordValue:
      type: string
      minLength: 20
      maxLength: 20
      description: Senha temporária (CSPRNG). Exibida uma única vez; nunca logada.

    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - ORIGIN_NOT_ALLOWED
        - PASSWORD_CHANGE_REQUIRED
        - MFA_ENROLLMENT_REQUIRED
        - MFA_VERIFICATION_REQUIRED
        - NOT_FOUND
        - STALE_STAGE
        - EMAIL_ALREADY_REGISTERED
        - MFA_ALREADY_ENROLLED
        - CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - PROCESS_NOT_ACTIVE
        - CLIENT_ARCHIVED
        - WEAK_PASSWORD
        - PASSWORD_UNCHANGED
        - INVALID_CURRENT_PASSWORD
        - INVALID_MFA_CODE
        - USER_LIMIT_REACHED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
          examples: ['about:blank']
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
          maxLength: 500
          description: Mensagem para humanos, sem detalhes internos.
        requestId:
          type: string
          pattern: '^[A-Za-z0-9-]{8,64}$'
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required: [path, message]
                properties:
                  path:
                    type: string
                    description: Caminho do campo (ex. `body.stages[2].name`).
                  message:
                    type: string
    StaleStageProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [currentStageId]
          properties:
            currentStageId:
              description: Fase atual no momento do conflito (null se o processo não está mais ativo).
              oneOf:
                - $ref: '#/components/schemas/Uuid'
                - type: 'null'

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 72
          description: No máximo 72 bytes UTF-8.
          writeOnly: true
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, role, displayName]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/Role'
        displayName:
          $ref: '#/components/schemas/DisplayName'
    SessionClient:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 160
    Session:
      type: object
      additionalProperties: false
      required: [user, client, aal, pendingActions]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        client:
          description: Cliente do usuário (null para CEO).
          oneOf:
            - $ref: '#/components/schemas/SessionClient'
            - type: 'null'
        aal:
          $ref: '#/components/schemas/Aal'
        pendingActions:
          type: array
          uniqueItems: true
          maxItems: 3
          items:
            $ref: '#/components/schemas/PendingAction'
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
          description: |
            No máximo 72 **bytes** UTF-8 (`maxLength` conta caracteres e só descarta o excesso
            óbvio: com letras de mais de um byte, 72 caracteres já passam de 72 bytes). Acima de 72
            bytes → 400 `VALIDATION_ERROR`. Se é a senha certa, só o servidor sabe: errada → 422
            `INVALID_CURRENT_PASSWORD`.
          writeOnly: true
        newPassword:
          type: string
          description: |
            Política: de 12 caracteres (pontos de código) a 72 bytes UTF-8, e diferente da atual.
            Sem `minLength`/`maxLength` de propósito: qualquer string que viole a política é 422
            `WEAK_PASSWORD` (E-12), nunca 400. O corpo inteiro é limitado a 16 KiB (413).
          writeOnly: true
    TotpEnrollment:
      type: object
      additionalProperties: false
      required: [factorId, uri, secret, qrCode]
      properties:
        factorId:
          $ref: '#/components/schemas/Uuid'
        uri:
          type: string
          pattern: '^otpauth://totp/'
          description: URI otpauth para apps autenticadores.
        secret:
          type: string
          description: Segredo base32 para digitação manual. Exibido uma única vez.
        qrCode:
          type: string
          pattern: '^data:image/svg\+xml'
          description: QR code em data URI SVG.
    TotpVerifyRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        factorId:
          $ref: '#/components/schemas/Uuid'
          deprecated: true
          description: |
            Obsoleto: omita. Sem ele o servidor usa o fator TOTP da sessão (ver `verifyTotp`). Se
            enviado, precisa ser fator TOTP do próprio usuário; fator alheio, inexistente ou removido
            → 422 `INVALID_MFA_CODE`, igual a um código errado. Nunca amplia o acesso: a identidade
            vem da sessão.
        code:
          type: string
          pattern: '^[0-9]{6}$'

