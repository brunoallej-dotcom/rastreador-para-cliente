          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        disabled:
          type: boolean
        mustChangePassword:
          type: boolean
        lastSignInAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ClientUserList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ClientUser'
    ProvisionClientUserRequest:
      type: object
      additionalProperties: false
      required: [email, displayName]
      properties:
        email:
          $ref: '#/components/schemas/Email'
