            - type: 'null'
    ProcessEventAction:
      type: string
      enum:
        - process.created
        - process.updated
        - process.cancelled
        - process.completed
        - stage.approved
    ProcessEvent:
      type: object
      additionalProperties: false
      required: [id, occurredAt, action, actor, details]
      properties:
        id:
          type: string
          pattern: '^[0-9]{1,19}$'
          description: 'Id sequencial do evento (bigint serializado como string, decimal canônico). É a ordem em que as escritas aconteceram, e é por ele que a lista é ordenada e paginada.'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        action:
          $ref: '#/components/schemas/ProcessEventAction'
        actor:
          description: 'CEO que executou a ação. `null` se for ação de sistema **ou** se o perfil dele não é legível (por exemplo, não existe mais): a linha do tempo mostra o que há, sem erro.'
          oneOf:
            - $ref: '#/components/schemas/ActorRef'
            - type: 'null'
        details:
          $ref: '#/components/schemas/ProcessEventDetails'
    ProcessEventDetails:
      type: object
      additionalProperties: false
      description: |
        Só o que a trilha de auditoria guarda, sem títulos nem nomes de pessoas. `stage.approved`
        traz `stageId` e, da fase, `stagePosition` e `stageName` (se a fase não é achada, só
        `stageId`). Os outros eventos (`process.created`, `process.updated`, `process.cancelled`,
        `process.completed`) têm `details: {}`. `previousTitle` e `newTitle` **nunca** vêm
        preenchidos: a trilha não guarda títulos (um `process.updated` não diz de qual título para
        qual), e o título de hoje estaria errado depois de um renome seguinte.
      properties:
        stageId:
          $ref: '#/components/schemas/Uuid'
        stagePosition:
          type: integer
          minimum: 1
          maximum: 30
        stageName:
          type: string
          maxLength: 120
        previousTitle:
          type: string
          maxLength: 160
          deprecated: true
          description: 'Nunca preenchido (veja a descrição de `ProcessEventDetails`).'
        newTitle:
          type: string
          maxLength: 160
          deprecated: true
          description: 'Nunca preenchido (veja a descrição de `ProcessEventDetails`).'
    ProcessEventList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProcessEvent'
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
    StageTemplateItem:
      type: object
      additionalProperties: false
      required: [position, name, description]
      properties:
