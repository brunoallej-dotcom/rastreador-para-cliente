openapi: 3.1.0
info:
  title: Rastreador para Cliente API
  version: 1.0.0-draft.4
  summary: Backend do rastreador de entregas (painel do cliente e painel dos CEOs).
  description: |
    Contrato normativo da API v1. Spec de origem: `docs/specs/client-delivery-tracker.md`.
    O código respeita este contrato; mudança incompatível vira `/api/v2`, e mudança aditiva é
    bump minor desta versão, com nota de compatibilidade.

    ## Autenticação
    Sessão em cookie `__Host-rt-session` (`HttpOnly; Secure; SameSite=Lax; Path=/`), emitido por
    `POST /auth/login`. O cookie pode ser dividido em `__Host-rt-session.0`, `.1`… Tokens nunca
    aparecem no corpo das respostas. **Deny by default:** só operações com `security: []` são
    públicas.

    ## Extensões
    - `x-auth-policy`: política declarada pelo handler (`withRoute`). `roles` são os papéis
      aceitos; `allowPending` são as pendências (`CHANGE_PASSWORD`, `ENROLL_MFA`, `VERIFY_MFA`)
      com as quais a operação continua acessível. Pendência fora da lista → 403 com o `code` da
      pendência.
    - `x-rate-limit`: limites aplicados antes da autenticação (escopo `ip` ou `account`) ou depois
      (escopo `user`). Excedido → 429 com `Retry-After`. Entradas com `programmatic: true` não são
      regras da política da rota: são orçamentos que o servidor gasta além dela, num contador
      nomeado (`group`) e, no escopo `global`, único para o app inteiro (todos os logins juntos).
      Excedidos, respondem 429 com `Retry-After`, exceto o de sessão (ver `sessionCookie`), que
      responde 401. A extensão também aparece em `sessionCookie`, porque esse orçamento é cobrado
      de qualquer operação autenticada.

    ## CSRF
    Métodos não seguros exigem o header `Origin` igual a uma origem permitida (senão 403
    `ORIGIN_NOT_ALLOWED`) e `Content-Type: application/json` quando há corpo (senão 415).
    Corpo limitado a 16 KiB (senão 413).

    ## Headers em todas as respostas
    `X-Request-Id`, `Cache-Control: no-store`, `Strict-Transport-Security`,
    `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'`,
    `X-Content-Type-Options: nosniff`, `X-Frame-Options: DENY`, `Referrer-Policy: no-referrer`,
    `Permissions-Policy`. `X-Request-Id` e `Cache-Control` estão declarados em cada resposta
    (inclusive nas de erro); os demais são do transporte e não se repetem em cada uma.

    ## Entrada
    Numa operação que declara um corpo, um campo que o contrato não tem é 400 `VALIDATION_ERROR`; numa
    que declara parâmetros de query (`limit`, `cursor`, `status`, `includeArchived`), um parâmetro que
    o contrato não tem (um `clientId` na lista do cliente, um `status` onde não há filtro) também é.
    O caminho vem em `errors[].path` (`body.<campo>`, `query.<campo>`). Um id malformado no path é 400.
    Uma operação que **não declara** corpo ou query não os lê: o que vier ali é ignorado (um corpo em
    `logout` ou em `resetClientUserPassword`, uma query em `getHealth`, `getClient`, `getProcess` ou
    `getMyProcess`). O que o servidor nunca faz é aceitar, num objeto que o contrato declara, um campo
    que ele não conhece.

    ## Texto visível
    Todo texto digitado por uma pessoa (nome de cliente, título de processo, nome e descrição de
    fase, nome de exibição do login) segue a mesma regra, antes de qualquer outra coisa. O servidor
    normaliza para NFC e apara as pontas (espaços, NBSP, U+3000, BOM e os demais do `trim` do
    JavaScript); `minLength` e `maxLength` contam caracteres (pontos de código) **depois** disso.
    Recusa (400 `VALIDATION_ERROR`) o que tem caractere de controle ou de formatação (quebra de
    linha, tabulação, espaço de largura zero, marcas bidi, separadores U+2028 e U+2029), "fillers"
    invisíveis (U+115F, U+1160, U+17B4, U+17B5, U+2800, U+3164, U+FFA0), um surrogate UTF-16 solto,
    e o texto sem nenhuma letra ou número ("***", só emoji). A descrição de fase em branco, depois de
    aparada, vale "sem descrição" (`null` na resposta). A resposta devolve o texto como foi
    guardado, já normalizado.

    ## Listas e cursor
    Toda lista pagina por cursor opaco (`nextCursor`, `null` na última página). A ordem é total e
    estável: `createdAt` decrescente e, para o mesmo instante, `id` crescente (clientes, processos
    de um cliente, `/me/processes`); a linha do tempo de um processo é por `id` do evento
    crescente (veja `listProcessEvents`). Nas listas por `createdAt`, um item criado depois de a
    primeira página ser lida entra antes do cursor e não aparece nas páginas seguintes, e nenhum
    item que já existia se repete ou se perde. O cursor só vale para o endpoint que o emitiu:
    cursor adulterado, truncado, de outro endpoint ou com posição que o banco não lê é 400. Ele
    não leva o cliente nem o processo do path, e um cursor bem formado que veio de outro recurso
    ou de outro usuário não amplia o acesso: só move a posição dentro do que quem o envia já lê.
    `limit` é inteiro de 1 a 100 (padrão 50), e fora disso é 400.

    ## Limites de taxa e contadores compartilhados
    O `x-rate-limit` de uma operação diz o limite; o **contador** é compartilhado entre as
    operações do mesmo grupo, por usuário, então gastar numa gasta nas outras:
    - **leituras**, 300 por minuto: `getSession`, `listMyProcesses`, `getMyProcess`, `listClients`,
      `getClient`, `listClientUsers`, `listClientProcesses`, `getProcess`, `listProcessEvents` e
      `getDefaultStageTemplate`. O cliente que consulta o painel e a sessão gasta o mesmo contador;
    - **escritas**, 60 por minuto: `logout`, `createClient`, `updateClient`, `updateClientUser`,
      `createProcess`, `updateProcess` e `approveCurrentStage`;
    - **senha de login de cliente**, 20 por hora, **um contador só** para `provisionClientUser` e
      `resetClientUserPassword` (as duas entregam uma senha): 12 provisionamentos e 8 resets, por
      exemplo, esgotam o contador.
    Excedido: 429 com `Retry-After`. As demais operações têm contador próprio. Os orçamentos
    `programmatic` (login global, TOTP diário, sessão por IP) são descritos nas entradas deles.

    ## Erros
    `application/problem+json` (RFC 9457) com `code` estável e `requestId`. Nunca contém stack,
    SQL ou mensagens de serviços internos. Recurso de outro tenant responde 404, nunca 403.
    Toda operação autenticada falha fechada com 503 `SERVICE_UNAVAILABLE` (e `Retry-After`) quando
    uma dependência de segurança (limitador de taxa, banco, Auth) está indisponível ou lenta: a
    requisição é negada, nunca liberada.

    ## Compatibilidade
    - `1.0.0-draft.4` (minor, **sem mudança de schema**). Aditivo, duas regras novas que mudam
      respostas que antes eram 2xx:
      - **Título único de processo ativo (F-80).** `createProcess` e `updateProcess` passam a
        documentar 409 `CONFLICT`, quando o título já é de outro processo **ativo** do mesmo
        cliente. A comparação ignora caixa, sequências de espaços e as diferenças de compatibilidade
        do Unicode (a mesma regra do nome de cliente, `createClient`). O título de um processo
        concluído ou cancelado pode ser usado de novo, e o de outro cliente não conta. Dois `POST`
        com o mesmo título, que criavam dois processos, agora dão 201 e 409. Um `POST` repetido
        depois de um 503, cuja primeira chamada já tinha sido gravada, dá 409 e não duplica o
        processo enquanto ele estiver ativo (se já foi concluído ou cancelado, o título voltou a
        ficar livre e a repetição cria outro): a descrição antiga, de que repetir criava um segundo
        processo, deixa de valer. `Idempotency-Key` foi rejeitado.
      - **Cliente arquivado congela os processos (F-87).** `approveCurrentStage` e `updateProcess`
        (renomear e cancelar) passam a responder 422 `CLIENT_ARCHIVED` para o processo de um
        cliente arquivado, qualquer que seja o status do processo, antes de `PROCESS_NOT_ACTIVE`.
        As leituras (`listClientProcesses`, `getProcess`, `listProcessEvents`, `listMyProcesses`,
        `getMyProcess`) continuam 200, e desarquivar (`updateClient` com `archived: false`)
        descongela. `createProcess` para cliente arquivado já era 422 `CLIENT_ARCHIVED`.
      - **Só documentação, sem mudança de comportamento:** semântica de retry de `createProcess`,
        `updateProcess`, `approveCurrentStage`, `provisionClientUser` e `resetClientUserPassword`;
        os contadores de limite compartilhados; a regra do texto visível (E-30) nos campos de
        texto; `progressPercent` (arredondamento) e o significado de `currentStage`; ordem das
        listas, desempate, cursor e parâmetros desconhecidos → 400 (nas operações que declaram
        query ou corpo; as que não declaram ignoram o que vier); a ordem das fases e os campos
        nulos por status; `Cache-Control` declarado como header de toda resposta;
        `previousTitle` e `newTitle` (nunca preenchidos, agora marcados `deprecated`: removê-los do
        schema é mudança incompatível e exige `/api/v2`); o formato de `ProcessEventDetails`;
        `actor: null`; `currentStageId: null`; o `expectedStageId` alheio → 409; a ordem da linha do
        tempo por `id`; a resposta do "Ok" relida depois do COMMIT; a regra de que o cliente da
        API nunca reenvia um "Ok" sozinho; e os casos E-81, E-82 e E-83 do painel do cliente.
    - `1.0.0-draft.3` (minor, **sem mudança de schema**). Aditivo: `createClient` e `updateClient`
      passam a documentar 409 `CONFLICT`, quando o nome já é de outro cliente **não arquivado**. A
      comparação trata como o mesmo nome: um acento decomposto e o composto ("Cafe" + U+0301 vale
      "Café", mas "Cafe" e "Café" seguem distintos); as formas de compatibilidade do Unicode, NFKC
      ("Acme™" e "AcmeTM", "①" e "1", letras de largura total como "Ａｃｍｅ"); e as diferenças só de
      caixa, de sequências de espaços e de marcas de variação invisíveis (U+034F, seletores de
      variação). A regra é nova e vale para entrada que antes dava 201: dois `POST` com o mesmo nome, que criavam dois
      clientes, agora dão 201 e 409. Um `POST` repetido depois de um 503, cuja primeira chamada já
      tinha sido gravada, também dá 409 e não duplica o cliente. Arquivar libera o nome, e desarquivar
      um cliente cujo nome foi tomado por um ativo dá 409. A descrição da resposta compartilhada
      `ServiceUnavailable` deixa de afirmar que repetir uma escrita é sempre seguro. Letras de outro
      alfabeto que se parecem com as latinas (o "А" cirílico) continuam passando.
    - `1.0.0-draft.2` (minor, **sem mudança incompatível**). Aditivo: `factorId` deixa de ser
      obrigatório em `verifyTotp` (o servidor resolve o fator da sessão); 503 documentado em toda
      operação autenticada; `x-rate-limit` passa a listar os orçamentos programáticos
      (`programmatic: true`). Documenta comportamento que já existia: política e 422/400 da senha em
      `changePassword` (o schema da nova senha perde `minLength`/`maxLength`, que prometiam um 400
      que o servidor nunca devolveu), `Set-Cookie` no 204, 503 de `changePassword`. `factorId`
      fica `deprecated`, mas **continua aceito** com o mesmo significado: um cliente que o envia
      não muda de comportamento.
    - `1.0.0-draft.1`: versão inicial.
  license:
    name: Proprietário — todos os direitos reservados
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Mesma origem do frontend (dev, preview e produção)
security:
  - sessionCookie: []
tags:
  - name: Health
    description: Verificação de disponibilidade (pública).
  - name: Auth
    description: Login, logout, sessão, troca de senha e MFA TOTP.
  - name: Client Panel
    description: Painel do cliente. Tenant derivado da sessão; nenhum id de cliente é aceito.
  - name: Admin Clients
    description: Painel dos CEOs — clientes (uma aba por cliente).
  - name: Admin Client Users
    description: Painel dos CEOs — logins dos clientes.
  - name: Admin Processes
    description: Painel dos CEOs — processos, fases, aprovações ("Ok") e linha do tempo.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Liveness simples. Não expõe versão, dependências nem detalhes internos.
      tags: [Health]
      security: []
      x-auth-policy:
        access: public
      x-rate-limit:
        - scope: ip
          limit: 60
          windowSeconds: 60
      responses:
        '200':
          description: Serviço no ar.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      operationId: login
      summary: Login com e-mail e senha
      description: |
        Cria a sessão e grava o cookie `__Host-rt-session`. A falha é sempre
        `401 INVALID_CREDENTIALS` com corpo idêntico (e-mail inexistente, senha errada ou conta
        desativada). Não existe cadastro público. Além dos limites por IP e por conta, todos os
        logins do app gastam um orçamento global (300 por 5 min, `programmatic`): acima dele, 429
        para todos até a janela passar, o que protege a cota do Auth.
      tags: [Auth]
      security: []
      x-auth-policy:
        access: public
      x-rate-limit:
        - scope: ip
          limit: 20
          windowSeconds: 900
        - scope: account
          limit: 10
          windowSeconds: 900
        - scope: global
          group: login
          limit: 300
          windowSeconds: 300
          programmatic: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              client:
                value:
                  email: contato@cliente.com.br
                  password: correct-horse-battery
      responses:
        '200':
          description: Sessão criada. Verifique `pendingActions` antes de seguir.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/logout:
    post:
      operationId: logout
      summary: Encerrar a sessão atual
      description: Revoga a sessão no servidor (escopo local) e limpa o cookie.
      tags: [Auth]
      x-auth-policy:
        access: authenticated
        roles: [client, ceo]
        allowPending: [CHANGE_PASSWORD, ENROLL_MFA, VERIFY_MFA]
      x-rate-limit:
        - scope: user
          limit: 60
          windowSeconds: 60
      responses:
        '204':
          $ref: '#/components/responses/NoContentClearCookie'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/session:
    get:
      operationId: getSession
      summary: Sessão atual
      description: Retorna o principal da sessão, o nível de garantia (`aal`) e as pendências.
      tags: [Auth]
      x-auth-policy:
        access: authenticated
        roles: [client, ceo]
        allowPending: [CHANGE_PASSWORD, ENROLL_MFA, VERIFY_MFA]
      x-rate-limit:
        - scope: user
          limit: 300
          windowSeconds: 60
      responses:
        '200':
          description: Sessão válida.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/password:
    post:
      operationId: changePassword
      summary: Trocar a própria senha
      description: |
        Exige a senha atual. Revoga as outras sessões do usuário e limpa a pendência
        `CHANGE_PASSWORD`; a sessão da requisição continua válida.

        **Política da nova senha:** de 12 caracteres (pontos de código) a 72 bytes UTF-8, e diferente
        da atual. Quem viola a política responde 422 `WEAK_PASSWORD`, e a igual à atual, 422
        `PASSWORD_UNCHANGED`; nunca 400, por isso o schema de `newPassword` não declara `minLength`
        nem `maxLength`. Senha atual errada → 422 `INVALID_CURRENT_PASSWORD`. Uma `currentPassword`
        com mais de 72 **bytes** UTF-8 → 400 `VALIDATION_ERROR` (é validação de forma, como no login).

        **Limites:** toda requisição gasta o rate limit da rota, a recusada também. A prova da senha
        atual é um sign-in no Auth e gasta o orçamento global de logins (300 por 5 min,
        `programmatic`): acima dele, 429.

        **Cookie:** o 204 só traz `Set-Cookie` quando o token da sessão foi renovado durante a
        chamada; o cookie é sempre o da própria sessão do usuário.

        **503 `SERVICE_UNAVAILABLE`:** se a falha ocorrer depois de o Auth gravar a senha nova (ou
        sem resposta que diga se gravou), a troca pode estar feita pela metade. Repita; se a senha
        atual for recusada, repita usando a nova senha como senha atual.
      tags: [Auth]
      x-auth-policy:
        access: authenticated
        roles: [client, ceo]
        allowPending: [CHANGE_PASSWORD, ENROLL_MFA]
      x-rate-limit:
        - scope: user
          limit: 5
          windowSeconds: 900
        - scope: global
          group: login
          limit: 300
          windowSeconds: 300
          programmatic: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContentSessionRefresh'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/mfa/totp/enroll:
    post:
      operationId: enrollTotp
      summary: Iniciar o cadastro de TOTP (CEO)
      description: |
        Cria um fator TOTP não verificado e devolve URI, segredo e QR code (exibidos uma única
        vez). Um fator não verificado anterior é substituído. Se já existir fator verificado,
        responde 409 `MFA_ALREADY_ENROLLED`.
      tags: [Auth]
      x-auth-policy:
        access: authenticated
        roles: [ceo]
        allowPending: [ENROLL_MFA]
      x-rate-limit:
        - scope: user
          limit: 10
          windowSeconds: 900
      responses:
        '200':
          description: Fator criado, aguardando verificação.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/mfa/totp/verify:
    post:
      operationId: verifyTotp
      summary: Verificar código TOTP (CEO)
      description: |
        Ativa o fator (no primeiro uso) e eleva a sessão para `aal2`. Os cookies são reescritos.

        **Qual fator.** O corpo traz só o `code`: o servidor resolve o fator TOTP da própria sessão
        autenticada (a identidade vem da credencial, nunca de um parâmetro). Com fator verificado
        (login em dispositivo novo, `VERIFY_MFA` pendente), é esse; sem nenhum verificado, é o fator
        pendente do cadastro (`ENROLL_MFA`, logo depois de `enrollTotp`). Sem nenhum fator TOTP, ou
        com mais de um fator no mesmo estado, a resposta é 422 `INVALID_MFA_CODE`: o app nunca cria
        mais de um (o `enrollTotp` mantém um só) e o servidor nunca tenta o código em vários fatores.
        O campo `factorId` está obsoleto, mas continua aceito: se enviado, precisa ser fator TOTP do
        próprio usuário; um fator alheio, inexistente ou removido responde como código errado.

        **Recusas.** Código errado, vencido, já usado (replay: o mesmo código do mesmo fator é
        recusado por 120 s) ou fator inválido → 422 `INVALID_MFA_CODE`, sempre com a mesma resposta.
        Toda requisição conta no rate limit da rota (5 por 5 min por usuário, inclusive a que acerta)
        e no teto diário de 20 por usuário (`programmatic`): acima de qualquer um, 429.
      tags: [Auth]
      x-auth-policy:
        access: authenticated
        roles: [ceo]
        allowPending: [ENROLL_MFA, VERIFY_MFA]
      x-rate-limit:
        - scope: user
          limit: 5
          windowSeconds: 300
        - scope: user
          group: totp-verify-daily
          limit: 20
          windowSeconds: 86400
          programmatic: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpVerifyRequest'
      responses:
        '200':
          description: Sessão elevada para aal2.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Set-Cookie:
              $ref: '#/components/headers/Set-Cookie-Session'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /me/processes:
    get:
      operationId: listMyProcesses
      summary: Listar os meus processos
